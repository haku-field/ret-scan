<!DOCTYPE html>
<html lang="ja">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FR7YFHM49H"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-FR7YFHM49H');
  </script>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ret-scan</title>

  <link
    rel="stylesheet"
    href="./style.css"
  />

</head>

<body>

  <main id="app">

    <!-- top -->
    <section
      id="topView"
      class="view active"
    >

      <div class="hero">

        <div class="hero-label">
          RET scan
        </div>

        <h1>
          現在状態の<br>
          共鳴スナップショット
        </h1>

        <p>
          これは固定人格診断ではありません。<br>
          現在の状態傾向を観測します。
        </p>

        <button
          id="startBtn"
          class="primary-btn"
        >
          scan start
        </button>

      </div>

    </section>

    <!-- questions -->
    <section
      id="questionView"
      class="view"
    >

      <div class="progress-wrap">

        <div id="progressText">
          0 / 0
        </div>

        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>

      </div>

      <div id="questionContainer"></div>

      <button
        id="nextBtn"
        class="primary-btn"
      >
        次へ
      </button>

    </section>

    <!-- result -->
    <section
      id="resultView"
      class="view"
    >

      <div class="result-header">

        <div class="hero-label">
          RET Snapshot
        </div>

        <h2>
          現在状態の観測結果
        </h2>

      </div>

      <div class="field-wrap">

        <canvas
          id="fieldCanvas"
          width="640"
          height="640"
        ></canvas>

      </div>

      <div
        id="activePatterns"
        class="active-patterns"
      ></div>

      <div class="bridge-section">

        <div class="bridge-card">

          <pre id="bridgeText"></pre>

          <div class="bridge-actions">

            <button
              id="copyBtn"
              class="copy-btn"
            >
              snapshot をコピー
            </button>

          </div>

        </div>

      </div>

    </section>

  </main>

  <script
    type="module"
    src="./main.js"
  ></script>

</body>
</html>
